# =============================================================================
# Market monitor configuration
# Edit this file to change watch levels, thresholds and keywords.
# No code changes needed - the function reads this file fresh on every run.
# =============================================================================

market_hours:
  start: "09:15"
  end: "15:30"
  timezone: "Asia/Kolkata"

# Instruments to poll. `kite_symbol` must match Kite's quote/ltp format
# ("EXCHANGE:TRADINGSYMBOL"). NIFTY 50 and NIFTY BANK are NSE indices.
symbols:
  NIFTY:
    kite_symbol: "NSE:NIFTY 50"
    # Each level is checked independently. `label` is free text used in the
    # alert message. Add/remove/edit as many as you like.
    watch_levels:
      - label: "Support S1"
        price: 24500
      - label: "Resistance R1"
        price: 24900
      - label: "My 24800 CE strike"
        price: 24800
  BANKNIFTY:
    kite_symbol: "NSE:NIFTY BANK"
    watch_levels:
      - label: "Support S1"
        price: 51500
      - label: "Resistance R1"
        price: 52500

# Minimum points the price must move back across a level before that level
# can trigger again. Prevents rapid re-alerting when price oscillates right
# at the line.
level_cross_hysteresis_points: 5

pivot_levels:
  # If true, auto-computed classic pivot points (P/R1-R3/S1-S3, from the
  # previous trading day's H/L/C) are merged in alongside the manual
  # watch_levels above for NIFTY/BANKNIFTY. Computed daily by
  # scripts/daily_kite_login.py on your VM and read from Table Storage at
  # alert time - no redeploy needed to pick up a new day's levels.
  # Requires Zerodha's paid Historical API add-on; if that's not enabled on
  # your Kite Connect app, this has no effect and only watch_levels above
  # are used.
  enabled: true

option_chain:
  # PCR (put-call ratio) and top-OI-strike-shift alerts for NIFTY/BANKNIFTY.
  # The actual strike window (NIFTY: ATM +/-4 strikes, BANKNIFTY: ATM +/-6
  # strikes - see OPTION_CHAIN_SYMBOLS in scripts/daily_kite_login.py) is
  # resolved once a day by the VM login script; this function only quotes
  # that already-curated list each cycle, so there's no extra Kite API
  # subscription cost beyond the base quote() calls it already makes.
  enabled: true
  pcr_alert:
    # Alert once when PCR (total put OI / total call OI across the tracked
    # strikes) moves outside this band - a common trader heuristic for a
    # sentiment extreme, not gospel; tune to taste.
    low_threshold: 0.7
    high_threshold: 1.3

vix:
  kite_symbol: "NSE:INDIA VIX"
  # Alert when VIX moves more than this % from the first reading of the day.
  intraday_move_pct_threshold: 5.0

positions:
  # Which checks to apply to each open position from kite.positions()["net"].
  # All enabled checks are evaluated independently per position.
  pnl_absolute_enabled: true
  pnl_absolute_threshold_rupees: 5000

  pnl_percentage_enabled: true
  # % of (average_price * quantity) magnitude.
  pnl_percentage_threshold: 20

  ltp_move_enabled: true
  # % move of LTP away from your average entry price.
  ltp_move_pct_threshold: 15

news:
  enabled: true
  keywords:
    - "Iran"
    - "Israel"
    - "Hormuz"
    - "Fed"
    - "FOMC"
    - "RBI"
    - "ceasefire"
    - "crude"
    - "war"
    - "missile"
    - "sanctions"
  # Free public RSS feeds. Add/remove as you like - no API key required.
  feeds:
    - "https://www.moneycontrol.com/rss/marketreports.xml"
    - "https://www.moneycontrol.com/rss/economy.xml"
    - "https://feeds.feedburner.com/ndtvprofit-latest"
    - "https://www.livemint.com/rss/markets"
    - "https://www.business-standard.com/rss/markets-106.rss"
    - "https://economictimes.indiatimes.com/markets/rssfeeds/1977021501.cms"
    - "https://www.aljazeera.com/xml/rss/all.xml"
    - "http://feeds.bbci.co.uk/news/world/rss.xml"
    - "http://feeds.bbci.co.uk/news/business/rss.xml"
    - "https://www.cnbc.com/id/100727362/device/rss/rss.html"
  # Ignore headlines older than this (avoids re-alerting on backfilled feed items).
  max_headline_age_hours: 12

alerting:
  # Minimum minutes between two alerts for the *same* condition, even if the
  # crossing/state-change logic would otherwise re-fire (defense in depth).
  cooldown_minutes: 15
